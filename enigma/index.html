  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    body { display: flex; align-items: center; justify-content: center; }
    /* the Amiga screen: 352x256 lowres pixels, scaled by the chosen zoom */
    #stage { position: relative; background: #000; }
    #screen { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; }
    #anim { position: absolute; overflow: hidden; }
    #anim canvas { position: absolute; left: 0; top: 0; image-rendering: pixelated; }
    #scene { cursor: grab; touch-action: none; }
    #scene:active { cursor: grabbing; }
    #original { visibility: hidden; pointer-events: none; }
    /* the start screen is drawn on the canvas; this transparent button over it takes the click, Space or Enter */
    #gate { position: absolute; inset: 0; z-index: 2; margin: 0; padding: 0; border: 0; background: none; cursor: pointer; }
    #gate[hidden] { display: none; }
    #gate:focus { outline: none; }

  </style>
